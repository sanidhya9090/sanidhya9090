name: Guestbook
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-entry:
    if: startsWith(github.event.issue.title, 'Guestbook:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            // Strip characters that could inject markup or links
            const clean = s => s.replace(/[<>\[\]`|()]/g, '').replace(/\s+/g, ' ').trim().slice(0, 200);
            const raw = (issue.body && issue.body.trim()) || issue.title.replace('Guestbook:', '');
            const msg = clean(raw) || 'Hello!';
            const user = issue.user.login;
            const date = new Date().toISOString().slice(0, 10);
            const entry = `- **[@${user}](https://github.com/${user})** (${date}): ${msg}`;
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace('<!-- GUESTBOOK:START -->', `<!-- GUESTBOOK:START -->\n${entry}`);
            fs.writeFileSync('README.md', readme);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: issue.number,
              body: 'Thanks for signing the guestbook! 🎉'
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: issue.number,
              state: 'closed'
            });
      - name: Commit README
        run: |
          git config user.name "guestbook-bot"
          git config user.email "guestbook-bot@users.noreply.github.com"
          git add README.md
          git commit -m "Add guestbook entry" || exit 0
          git push
